<!DOCTYPE html>
<html>
  <head>
    <title>Flow</title>
  </head>
  <body>
    <script>
      let name = "Alice";
      let age = 30;

      function greet(name){
        console.log("Hello, " + name + "!");
      }

      function isAdult(age){
        if(age >= 18){
          console.log("You are an adult.");
        } else {
          console.log("You are not an adult.");
        }
      }
 
      greet(name);
      isAdult(age);
    </script>
  </body>
</html>
